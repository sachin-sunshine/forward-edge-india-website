<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── Intersection hook ── */
function useVisible(threshold = 0.15) {
  const ref = useRef(null);
  const [v, setV] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold });
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, v];
}

/* ── Animated counter ── */
function Counter({ to, suf = '', pre = '', dur = 2200 }) {
  const [n, setN] = useState(0);
  const [ref, v] = useVisible();
  const started = useRef(false);
  useEffect(() => {
    if (!v || started.current) return;
    started.current = true;
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      const e = 1 - Math.pow(1 - p, 3);
      setN(Math.floor(e * to));
      if (p < 1) requestAnimationFrame(tick); else setN(to);
    };
    requestAnimationFrame(tick);
  }, [v, to, dur]);
  return <span ref={ref}>{pre}{n.toLocaleString('en-IN')}{suf}</span>;
}

            }}>FE</div>

              <div style={{ fontSize:'.6rem', color:'#d4a017', fontWeight:700, letterSpacing:'.15em', textTransform:'uppercase' }}>India LLP</div>
            </div>
          </a>
          {/* Desktop links */}

            {links.map(l => (
              <a key={l} href={`#${l.toLowerCase()}`} className="nav-link"
                style={{ textDecoration: 'none', color: '#e5e7eb', fontSize: '.92rem', fontWeight: 500 }}>{l}</a>
            ))}
            <a href="#contact" style={{
              background: 'linear-gradient(135deg,#d4a017,#f0c040)',
              color: '#0a0e1a', padding: '10px 24px', borderRadius: '8px',
              fontWeight: 700, fontSize: '.9rem', textDecoration: 'none',

               onMouseOut={e => e.currentTarget.style.opacity='1'}>Get Free Consultation</a>
          </div>
          {/* Hamburger */}
          <button onClick={() => setOpen(o => !o)}
            style={{ display: 'none', background: 'none', border: 'none', color: '#fff', fontSize: '1.6rem', cursor: 'pointer' }}
            className="md:block" id="hamburger">☰</button>
          <button onClick={() => setOpen(o => !o)}

}
